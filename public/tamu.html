<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17201b">
<title>Buku Tamu Raja &amp; Febri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: one column dashboard, summary tiles first, then link maker, then guest lists */
:root{
  --night:#17201b; --moss:#223029; --line:#3a4a40; --gold:#d4ad6e; --blush:#e6b8ad; --ivory:#f3ece0; --muted:#b9b3a6;
  --ok:#8fc49a; --warn:#e6b8ad;
  --script:"Pinyon Script","Segoe Script",cursive; --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ivory);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 60px;display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--script);font-weight:400;font-size:2.8rem;color:var(--gold);margin:0;line-height:1.1}
h2{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin:0}
.sub{color:var(--muted);font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--moss);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile b{display:block;font-family:var(--serif);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ivory);line-height:1.1}
.tile span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile.ok b{color:var(--ok)} .tile.warn b{color:var(--warn)} .tile.gold b{color:var(--gold)}
.card{background:var(--moss);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
textarea,input,select{width:100%;font:inherit;color:var(--ivory);background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.btn{font:inherit;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.solid{background:var(--gold);color:var(--night)}
.btn.sm{padding:6px 11px;font-size:.7rem}
.btn:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:.8rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:var(--night)}
.table{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--night);position:sticky;top:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.no{color:var(--warn)}
.links{display:grid;gap:8px;max-height:420px;overflow:auto}
.lk{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.lk .n{font-weight:500}
.lk .u{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.lk.sent{opacity:.55}
.empty{color:var(--muted);font-size:.9rem;padding:14px;text-align:center}
.note{font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Buku Tamu</h1>
      <div class="sub">Undangan Raja &amp; Febri · Resepsi Sabtu, 2 Januari 2027 · <span id="updated">memuat…</span></div>
    </div>
    <div class="row">
      <a class="btn" href="./">Lihat undangan</a>
      <a class="btn" href="checkin.html">Buka check-in</a>
    </div>
  </header>

  <section class="tiles" aria-label="Ringkasan">
    <div class="tile gold"><b id="tUcapan">–</b><span>Ucapan masuk</span></div>
    <div class="tile ok"><b id="tHadir">–</b><span>Konfirmasi hadir</span></div>
    <div class="tile ok"><b id="tOrang">–</b><span>Perkiraan orang</span></div>
    <div class="tile warn"><b id="tTidak">–</b><span>Berhalangan</span></div>
    <div class="tile"><b id="tCheckin">–</b><span>Sudah check-in</span></div>
  </section>

  <section class="card" aria-labelledby="mkTitle">
    <h2 id="mkTitle">Buat link undangan per tamu</h2>
    <div class="grid2">
      <div>
        <label for="names">Nama tamu (satu nama per baris)</label>
        <textarea id="names" placeholder="Budi Santoso&#10;Keluarga Bpk. Ahmad&#10;Siti &amp; Suami"></textarea>
      </div>
      <div style="display:grid;gap:12px;align-content:start">
        <div>
          <label for="side">Tamu dari pihak</label>
          <select id="side"><option value="">Umum</option><option value="r">Raja</option><option value="f">Febri</option></select>
        </div>
        <div>
          <label for="tpl">Pesan WhatsApp ({nama} dan {link} diganti otomatis)</label>
          <textarea id="tpl" style="min-height:150px"></textarea>
        </div>
      </div>
    </div>
    <div class="row">
      <button class="btn solid" type="button" id="make">Buat link</button>
      <button class="btn" type="button" id="copyAll">Salin semua pesan</button>
      <span class="note" id="mkNote"></span>
    </div>
    <div class="links" id="links"><div class="empty">Tulis nama tamu lalu tekan "Buat link".</div></div>
  </section>

  <section class="card" aria-labelledby="lsTitle">
    <div class="row" style="justify-content:space-between">
      <h2 id="lsTitle">Daftar tamu</h2>
      <div class="tabs" role="tablist">
        <button type="button" class="on" data-tab="rsvp" role="tab">Ucapan &amp; RSVP</button>
        <button type="button" data-tab="checkin" role="tab">Check-in</button>
      </div>
    </div>
    <div class="row">
      <input id="q" placeholder="Cari nama…" style="flex:1;min-width:180px">
      <button class="btn" type="button" id="csv">Unduh Excel (CSV)</button>
    </div>
    <div class="table"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </section>
</div>

<script>
const SUPABASE_URL = "https://jjkrkdyqkdhwmoathwbz.supabase.co";
const SUPABASE_KEY = "sb_publishable_M-c-ba8AfKp06mNyDStOag_wUqRu1MJ";
const H = { apikey: SUPABASE_KEY };
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const fmtTime = t => new Date(t).toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Jakarta" });

let rsvp = [], hadirList = [], tab = "rsvp";
async function load() {
  try {
    const [a, b] = await Promise.all([
      fetch(SUPABASE_URL + "/rest/v1/ucapan?select=nama,hadir,jumlah,ucapan,waktu&order=waktu.desc&limit=1000", { headers: H }),
      fetch(SUPABASE_URL + "/rest/v1/kehadiran?select=nama,waktu&order=waktu.desc&limit=2000", { headers: H })
    ]);
    if (!a.ok || !b.ok) throw new Error();
    rsvp = await a.json(); hadirList = await b.json();
    const yes = rsvp.filter(r => r.hadir === "Hadir");
    $("#tUcapan").textContent = rsvp.length;
    $("#tHadir").textContent = yes.length;
    $("#tOrang").textContent = yes.reduce((n, r) => n + (Number(r.jumlah) || 1), 0);
    $("#tTidak").textContent = rsvp.length - yes.length;
    $("#tCheckin").textContent = new Set(hadirList.map(r => r.nama.toLowerCase())).size;
    $("#updated").textContent = "diperbarui " + new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
    render();
  } catch (e) {
    $("#updated").textContent = "gagal memuat data, coba muat ulang halaman";
  }
}
function rows() {
  const q = $("#q").value.trim().toLowerCase();
  const src = tab === "rsvp" ? rsvp : hadirList;
  return q ? src.filter(r => r.nama.toLowerCase().includes(q)) : src;
}
function render() {
  const th = $("#thead"), tb = $("#tbody");
  th.innerHTML = tab === "rsvp"
    ? "<tr><th>Nama</th><th>Status</th><th>Orang</th><th>Ucapan</th><th>Waktu</th></tr>"
    : "<tr><th>Nama</th><th>Waktu check-in</th></tr>";
  tb.textContent = "";
  const list = rows();
  if (!list.length) {
    const tr = document.createElement("tr"), td = document.createElement("td");
    td.colSpan = 5; td.className = "empty"; td.textContent = tab === "rsvp" ? "Belum ada ucapan." : "Belum ada tamu yang check-in.";
    tr.appendChild(td); tb.appendChild(tr); return;
  }
  list.forEach(r => {
    const tr = document.createElement("tr");
    const cell = (txt, cls) => { const td = document.createElement("td"); if (cls) td.className = cls; td.textContent = txt; tr.appendChild(td); return td; };
    cell(r.nama);
    if (tab === "rsvp") {
      const td = cell(""); const p = document.createElement("span");
      p.className = "pill " + (r.hadir === "Hadir" ? "ok" : "no"); p.textContent = r.hadir; td.appendChild(p);
      cell(r.hadir === "Hadir" ? String(r.jumlah || 1) : "–", "num");
      cell(r.ucapan);
    }
    cell(fmtTime(r.waktu), "num");
    tb.appendChild(tr);
  });
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  render();
}));
$("#q").addEventListener("input", render);

$("#csv").addEventListener("click", () => {
  const list = rows();
  const esc = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const head = tab === "rsvp" ? ["Nama", "Status", "Jumlah orang", "Ucapan", "Waktu"] : ["Nama", "Waktu check-in"];
  const body = list.map(r => tab === "rsvp"
    ? [r.nama, r.hadir, r.hadir === "Hadir" ? (r.jumlah || 1) : 0, r.ucapan, fmtTime(r.waktu)]
    : [r.nama, fmtTime(r.waktu)]);
  const csv = "﻿" + [head, ...body].map(row => row.map(esc).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = (tab === "rsvp" ? "rsvp" : "checkin") + "-raja-febri.csv";
  document.body.appendChild(a); a.click(); a.remove();
});

// ---- Link maker ----
const DEFAULT_TPL = "Assalamu'alaikum Warahmatullahi Wabarakatuh.\n\nKepada Yth.\nBapak/Ibu/Saudara/i *{nama}*\n\nTanpa mengurangi rasa hormat, kami mengundang Anda untuk hadir di acara pernikahan kami:\n\n*Raja & Febri*\nSabtu, 2 Januari 2027 · 07.00 WIB\nKp. Peusar, Binong, Curug, Tangerang\n\nInfo lengkap, lokasi, dan konfirmasi kehadiran:\n{link}\n\nMerupakan suatu kehormatan bagi kami apabila Anda berkenan hadir dan memberikan doa restu.\n\nWassalamu'alaikum Warahmatullahi Wabarakatuh.";
$("#tpl").value = store.get("rf_tpl", DEFAULT_TPL);
$("#names").value = store.get("rf_names", "");
$("#side").value = store.get("rf_side", "");
let sent = new Set(JSON.parse(store.get("rf_sent", "[]")));
const base = location.origin + location.pathname.replace(/[^/]*$/, "");
const slug = n => n.trim().replace(/\s+/g, "_").replace(/[^\p{L}\p{N}_.~-]/gu, "");
let made = [];
function makeLinks() {
  store.set("rf_tpl", $("#tpl").value); store.set("rf_names", $("#names").value); store.set("rf_side", $("#side").value);
  const side = $("#side").value;
  const names = [...new Set($("#names").value.split(/\n/).map(s => s.trim()).filter(s => s.length >= 2))];
  made = names.map(n => {
    const link = base + "#" + slug(n) + (side ? "-" + side : "");
    return { n, link, msg: $("#tpl").value.replaceAll("{nama}", n).replaceAll("{link}", link) };
  });
  const box = $("#links"); box.textContent = "";
  if (!made.length) { box.innerHTML = '<div class="empty">Tulis nama tamu lalu tekan "Buat link".</div>'; $("#mkNote").textContent = ""; return; }
  made.forEach(m => {
    const el = document.createElement("div"); el.className = "lk" + (sent.has(m.link) ? " sent" : "");
    const info = document.createElement("div"); info.style.minWidth = "0";
    const n = document.createElement("div"); n.className = "n"; n.textContent = m.n;
    const u = document.createElement("div"); u.className = "u"; u.textContent = m.link;
    info.append(n, u);
    const act = document.createElement("div"); act.className = "row";
    const wa = document.createElement("a"); wa.className = "btn sm solid"; wa.target = "_blank"; wa.rel = "noopener";
    wa.href = "https://wa.me/?text=" + encodeURIComponent(m.msg); wa.textContent = sent.has(m.link) ? "Kirim lagi" : "Kirim WA";
    wa.addEventListener("click", () => { sent.add(m.link); store.set("rf_sent", JSON.stringify([...sent])); el.classList.add("sent"); wa.textContent = "Kirim lagi"; });
    const cp = document.createElement("button"); cp.type = "button"; cp.className = "btn sm"; cp.textContent = "Salin";
    cp.addEventListener("click", () => navigator.clipboard.writeText(m.msg).then(() => { cp.textContent = "Tersalin"; setTimeout(() => cp.textContent = "Salin", 1500); }, () => {}));
    act.append(wa, cp);
    el.append(info, act); box.appendChild(el);
  });
  $("#mkNote").textContent = made.length + " link siap dikirim";
}
$("#make").addEventListener("click", makeLinks);
$("#copyAll").addEventListener("click", () => {
  if (!made.length) makeLinks();
  navigator.clipboard.writeText(made.map(m => m.msg).join("\n\n— — —\n\n")).then(() => $("#mkNote").textContent = "Semua pesan disalin", () => {});
});
if ($("#names").value.trim()) makeLinks();

load();
setInterval(() => { if (!document.hidden) load(); }, 20000);
</script>
</body>
</html>
