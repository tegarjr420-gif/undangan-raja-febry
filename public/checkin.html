<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17201b">
<title>Check-in Tamu Raja &amp; Febri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: phone-first scanner for the guest desk: camera on top, result card, manual entry, recent list */
:root{
  --night:#17201b; --moss:#223029; --line:#3a4a40; --gold:#d4ad6e; --blush:#e6b8ad; --ivory:#f3ece0; --muted:#b9b3a6; --ok:#8fc49a;
  --script:"Pinyon Script","Segoe Script",cursive; --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ivory);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:20px 50px;display:grid;gap:16px}
h1{font-family:var(--script);font-weight:400;font-size:2.5rem;color:var(--gold);margin:0;line-height:1.1;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:.85rem}
.count{display:flex;justify-content:center;gap:8px;align-items:baseline}
.count b{font-family:var(--serif);font-size:2.4rem;font-variant-numeric:tabular-nums;color:var(--ok)}
.cam{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--moss);border:1px solid var(--line);display:grid;place-items:center}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18%;border:3px solid var(--gold);border-radius:16px;box-shadow:0 0 0 999px rgba(23,32,27,.35)}
.cam .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.8rem;color:var(--ivory)}
.result{border-radius:14px;padding:18px;text-align:center;display:grid;gap:4px;border:1px solid var(--line);background:var(--moss)}
.result.ok{border-color:var(--ok);background:#20352a}
.result.dup{border-color:var(--blush);background:#3a2b29}
.result .who{font-family:var(--serif);font-size:1.7rem;font-weight:600;line-height:1.2}
.result .msg{font-size:.85rem;color:var(--muted)}
.btn{font:inherit;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;text-decoration:none}
.btn.solid{background:var(--gold);color:var(--night)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--ivory);background:var(--moss);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li{display:flex;justify-content:space-between;gap:10px;background:var(--moss);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
li time{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:.8rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Check-in Tamu</h1>
    <div class="sub">Resepsi Raja &amp; Febri · Sabtu, 2 Januari 2027</div>
  </div>
  <div class="count"><b id="total">0</b><span>tamu sudah hadir</span></div>

  <div class="cam" id="cam">
    <video id="video" playsinline muted hidden></video>
    <div class="frame" hidden id="frame"></div>
    <button class="btn solid" type="button" id="startCam">Nyalakan kamera untuk scan QR</button>
    <div class="hint" id="hint" hidden>Arahkan kamera ke kode QR di HP tamu</div>
  </div>

  <div class="result" id="result" aria-live="polite">
    <span class="msg">Hasil scan muncul di sini</span>
  </div>

  <form class="row" id="manual">
    <input id="manualName" placeholder="Tamu tanpa QR? Ketik nama di sini" maxlength="60" autocomplete="off">
    <button class="btn" type="submit">Catat</button>
  </form>

  <div>
    <div class="note" style="text-align:left;margin-bottom:6px">Terakhir hadir</div>
    <ul id="recent"></ul>
  </div>
  <p class="note"><a href="tamu.html" style="color:var(--gold)">Buka Buku Tamu</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const SUPABASE_URL = "https://jjkrkdyqkdhwmoathwbz.supabase.co";
const SUPABASE_KEY = "sb_publishable_M-c-ba8AfKp06mNyDStOag_wUqRu1MJ";
const API = SUPABASE_URL + "/rest/v1/kehadiran";
const H = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
const $ = s => document.querySelector(s);
let rows = [];
const known = () => new Set(rows.map(r => r.nama.toLowerCase()));

async function load() {
  try {
    const r = await fetch(API + "?select=nama,waktu&order=waktu.desc&limit=2000", { headers: H });
    if (!r.ok) throw new Error();
    rows = await r.json();
    render();
  } catch (e) {}
}
function render() {
  $("#total").textContent = known().size;
  const ul = $("#recent"); ul.textContent = "";
  rows.slice(0, 12).forEach(r => {
    const li = document.createElement("li");
    const n = document.createElement("span"); n.textContent = r.nama;
    const t = document.createElement("time"); t.textContent = new Date(r.waktu).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
    li.append(n, t); ul.appendChild(li);
  });
}
function show(kind, who, msg) {
  const el = $("#result");
  el.className = "result " + kind;
  el.innerHTML = '<span class="who"></span><span class="msg"></span>';
  el.querySelector(".who").textContent = who;
  el.querySelector(".msg").textContent = msg;
}
let busy = false, lastName = "", lastAt = 0;
async function checkIn(nama) {
  nama = nama.trim().slice(0, 60);
  if (nama.length < 2 || busy) return;
  if (nama === lastName && Date.now() - lastAt < 6000) return;
  lastName = nama; lastAt = Date.now();
  if (known().has(nama.toLowerCase())) {
    const prev = rows.find(r => r.nama.toLowerCase() === nama.toLowerCase());
    show("dup", nama, "Sudah check-in pukul " + new Date(prev.waktu).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }));
    return;
  }
  busy = true;
  try {
    const r = await fetch(API, { method: "POST", headers: { ...H, Prefer: "return=minimal" }, body: JSON.stringify({ nama }) });
    if (!r.ok) throw new Error();
    if (navigator.vibrate) navigator.vibrate(120);
    show("ok", nama, "Selamat datang! Kehadiran tercatat.");
    await load();
  } catch (e) {
    show("dup", nama, "Gagal mencatat. Periksa internet lalu coba lagi.");
    lastName = "";
  } finally { busy = false; }
}

$("#manual").addEventListener("submit", e => { e.preventDefault(); checkIn($("#manualName").value); $("#manualName").value = ""; });

$("#startCam").addEventListener("click", async () => {
  const v = $("#video");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    v.srcObject = stream; await v.play();
    v.hidden = false; $("#frame").hidden = false; $("#hint").hidden = false; $("#startCam").hidden = true;
    const c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });
    const tick = () => {
      if (v.readyState === v.HAVE_ENOUGH_DATA && window.jsQR) {
        const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth) || 480;
        c.width = w; c.height = h; ctx.drawImage(v, 0, 0, w, h);
        const code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
        if (code && code.data) {
          if (code.data.startsWith("RAJAFEBRI|")) checkIn(code.data.slice(10));
          else show("dup", "QR tidak dikenal", "Ini bukan kartu masuk undangan Raja & Febri.");
        }
      }
      requestAnimationFrame(tick);
    };
    tick();
  } catch (e) {
    show("dup", "Kamera tidak bisa dibuka", "Izinkan akses kamera di browser, atau ketik nama tamu secara manual di bawah.");
  }
});

load();
setInterval(() => { if (!document.hidden) load(); }, 15000);
</script>
</body>
</html>
